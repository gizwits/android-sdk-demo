[versions]
androidxComposeCompiler = "1.4.6"
androidGradlePlugin = "8.7.3"
kotlin = "1.8.20"
androidxCore = "1.9.0"
androidxComposeBom = "2023.04.01"
androidxComposeMaterial3 = "1.2.0-alpha03"
androidxComposeMaterial = "1.3.1"
androidxNavigation = "2.5.3"
androidxHiltNavigationCompose = "1.0.0"
hilt = "2.44.2"
accompanist = "0.28.0"
datastorePreferences = "1.0.0"
camerax = "1.2.0"
barcodeScanning = "17.3.0"
gson="2.9.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "androidxComposeBom" }
androidx-compose-material = { group = "androidx.compose.material", name = "material", version.ref = "androidxComposeMaterial" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "androidxComposeMaterial3" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "androidxNavigation" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "androidxHiltNavigationCompose" }
accompanist-systemuicontroller = { group = "com.google.accompanist", name = "accompanist-systemuicontroller", version.ref = "accompanist" }
